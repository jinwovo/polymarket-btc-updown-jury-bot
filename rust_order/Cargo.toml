[package]
name = "polymarket-fast-order"
version = "0.2.0"
edition = "2021"

[dependencies]
# EIP-712 signing (same stack as official rs-clob-client)
alloy-primitives = "1"
alloy-sol-types = "1"
alloy-signer = "1"
alloy-signer-local = "1"

# HMAC-SHA256 for L2 API auth
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# HTTP + JSON
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Salt generation
rand = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
