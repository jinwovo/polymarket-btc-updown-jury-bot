[package]
name = "polymarket-fast-order"
version = "0.1.0"
edition = "2021"

[dependencies]
polymarket-hft = "0.0.7"
alloy-signer-local = "0.5"
alloy-primitives = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
